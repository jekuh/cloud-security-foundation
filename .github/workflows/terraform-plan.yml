name: terraform-plan

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud to target
        required: true
        type: choice
        options:
          - aws
          - gcp
      target_env:
        description: Environment to target
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: eu-central-1

jobs:
  plan:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.cloud }}-${{ inputs.target_env }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to Google Cloud (OIDC)
        if: ${{ inputs.cloud == 'gcp' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Terraform fmt (check)
        working-directory: ${{ inputs.cloud }}
        run: terraform fmt -check -diff -recursive

      - name: Init
        working-directory: ${{ inputs.cloud }}/envs/${{ inputs.target_env }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validate
        working-directory: ${{ inputs.cloud }}/envs/${{ inputs.target_env }}
        run: terraform validate -no-color

      - name: Plan
        working-directory: ${{ inputs.cloud }}/envs/${{ inputs.target_env }}
        run: terraform plan -input=false -no-color -lock-timeout=5m
